name: Pact-JVM Build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ master, v4.1.x, v4.5.x, v4.6.x, v4.7.x ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

# Gradle always runs on JDK 17, and the tests run on the JDK being tested (using the testJavaHome property).
# This lets us test on JDKs that are newer than the version of Gradle supports.
env:
  LATEST_JDK: 27

jobs:
  latest_jdk:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ ubuntu-latest, windows-latest, macos-latest ]
        module: [ core, 'consumer -x :consumer:junit:clojureTest', provider, pact-specification-test, pact-jvm-server ]
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK ${{ env.LATEST_JDK }} for the tests
      id: test-jdk
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ env.LATEST_JDK }}
    - name: Set up JDK 17 for Gradle
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
        restore-keys: ${{ runner.os }}-gradle
    - run: ./gradlew -v
    - name: Build with Gradle
      run: ./gradlew -s --no-daemon -i -p ${{ matrix.module }} check
      env:
        ORG_GRADLE_PROJECT_testJavaHome: ${{ steps.test-jdk.outputs.path }}

  v2_engine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [ core, consumer, provider, pact-specification-test ]
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ env.LATEST_JDK }} for the tests
        id: test-jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.LATEST_JDK }}
      - name: Set up JDK 17 for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build with Gradle
        run: ./gradlew -s --no-daemon -i -p ${{ matrix.module }} check
        env:
          ORG_GRADLE_PROJECT_testJavaHome: ${{ steps.test-jdk.outputs.path }}
          PACT_MATCHING_ENGINE: v2
          PACT_V2_MATCHING_LOG_EXECUTED_PLAN: 1

  supported_jdks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [ core, consumer, provider, pact-specification-test ]
        # The LTS releases. The latest release is tested by the latest_jdk job.
        jdk: [ 17, 21, 25 ]
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.jdk }} for the tests
        id: test-jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - name: Set up JDK 17 for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle
      - run: ./gradlew -v
      - name: Build with Gradle
        run: ./gradlew -s --no-daemon -i -p ${{ matrix.module }} check
        env:
          ORG_GRADLE_PROJECT_testJavaHome: ${{ steps.test-jdk.outputs.path }}
