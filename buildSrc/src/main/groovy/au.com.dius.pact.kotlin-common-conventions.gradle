plugins {
    // Apply the org.jetbrains.kotlin.jvm Plugin to add support for Kotlin.
    id 'org.jetbrains.kotlin.jvm'

    id 'groovy'
    id 'codenarc'
}

// Detekt blows up on JDK 23
if (JavaVersion.current() < JavaVersion.VERSION_23) {
    project.plugins.apply('io.gitlab.arturbosch.detekt')
}

repositories {
    mavenLocal()
    mavenCentral()
}

version = '4.7.6'

java {
    targetCompatibility = '17'
    sourceCompatibility = '17'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    constraints {
        // Define dependency versions as constraints
        api 'org.apache.httpcomponents.client5:httpclient5:5.6.5'
        api 'org.apache.httpcomponents.client5:httpclient5-fluent:5.6.5'
        api 'org.json:json:20260814'
        api 'io.pact.plugin.driver:core:1.2.4' // remember also to update implementation
        api 'org.apache.tika:tika-core:4.1.0'
        api 'io.github.oshai:kotlin-logging-jvm:7.0.14'

        implementation 'commons-codec:commons-codec:1.23.0'
        implementation 'commons-io:commons-io:2.22.0'
        implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.3.21'
        implementation 'org.apache.commons:commons-lang3:3.21.0'
        implementation 'org.apache.commons:commons-text:1.15.0'
        implementation 'org.apache.commons:commons-collections4:4.6.0'
        implementation 'org.apache.tika:tika-core:4.1.0'
        implementation 'com.google.guava:guava:33.7.2-jre'
        implementation 'org.slf4j:slf4j-api:2.0.20'
        implementation 'io.ktor:ktor-http-jvm:3.6.0'
        implementation 'io.ktor:ktor-server-netty:3.6.0'
        implementation 'io.ktor:ktor-network-tls-certificates:3.6.0'
        implementation 'io.ktor:ktor-server-call-logging:3.6.0'
        implementation 'io.netty:netty-handler:4.2.19.Final'
        implementation 'org.apache.groovy:groovy:4.0.33'
        implementation 'org.apache.groovy:groovy-json:4.0.33'
        implementation 'org.apache.groovy:groovy-xml:4.0.33'
        implementation 'io.pact.plugin.driver:core:1.2.4'  //remember to also update under api
        implementation 'io.github.oshai:kotlin-logging-jvm:7.0.14'

        testImplementation 'org.apache.groovy:groovy:4.0.33'
        testImplementation 'org.apache.groovy:groovy-json:4.0.33'
        testImplementation 'org.apache.groovy:groovy-datetime:4.0.33'
        testImplementation 'org.apache.groovy:groovy-xml:4.0.33'
        testImplementation 'org.apache.groovy:groovy-nio:4.0.33'
        testImplementation 'org.hamcrest:hamcrest:3.0'
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'ch.qos.logback:logback-classic:1.5.38'
        testImplementation 'ch.qos.logback:logback-core:1.5.38'
        testImplementation 'net.bytebuddy:byte-buddy:1.18.16'
        testImplementation 'com.github.tomakehurst:wiremock-jre8:2.35.2'
        testImplementation 'org.junit.vintage:junit-vintage-engine:5.14.4'
        testImplementation 'org.junit.jupiter:junit-jupiter-api:5.14.4'
    }

    // Align versions of all Kotlin components
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.3.21')

    // Use the Kotlin JDK 8 standard library.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.3.21'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:2.3.21'

    codenarc('org.codenarc:CodeNarc:3.7.0-groovy-4.0')
    codenarc('org.apache.groovy:groovy:4.0.33')
}

testing {
    suites {
        // Configure the built-in test suite
        test {
            // Use JUnit Jupiter test framework
            useJUnitJupiter('5.14.4')
        }
    }
}

test {
    // Mark sure Pact-JVM builds don't skew the metrics
    systemProperty 'pact_do_not_track', 'true'

    // Spock's @Timeout uses virtual threads if the JVM has them, but on JDK 19 and 20 they are a preview feature
    if (JavaVersion.current() in [JavaVersion.VERSION_19, JavaVersion.VERSION_20]) {
        jvmArgs '--enable-preview'
    }
}

tasks.withType(CodeNarc).configureEach { codeNarcTask ->
    reports {
        console {
            required = true
        }
    }
}

codenarcMain {
    configFile = rootProject.file('config/codenarc/ruleset.groovy')
}

codenarcTest {
    configFile = rootProject.file('config/codenarc/rulesetTest.groovy')
}

if (JavaVersion.current() < JavaVersion.VERSION_23) {
    detekt {
        config = files(rootProject.file("config/detekt-config.yml"))
    }
}
